<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reálná odjezdová tabule SŽDC (2018)</title>
    <style>
        /* Přesné barvy podle grafického manuálu SŽDC z roku 2018 */
        :root {
            --szdc-dark-blue: #0b1c33;
            --szdc-light-blue: #1c355e;
            --szdc-yellow: #ffcc00;
            --szdc-orange: #ff6600;
            --szdc-white: #ffffff;
            --szdc-gray: #a0aab5;
        }

        body {
            background-color: #000;
            color: var(--szdc-white);
            font-family: 'Arial Target', 'Ubuntu', 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .board-container {
            background-color: var(--szdc-dark-blue);
            width: 100%;
            max-width: 1200px;
            border: 4px solid #222;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }

        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background-color: var(--szdc-light-blue);
            border-bottom: 3px solid var(--szdc-yellow);
        }

        .station-name {
            font-size: 28px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .current-time {
            font-size: 28px;
            font-weight: bold;
            color: var(--szdc-yellow);
        }

        .departure-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 18px;
        }

        .departure-table th {
            background-color: var(--szdc-light-blue);
            color: var(--szdc-gray);
            text-align: left;
            padding: 10px 15px;
            font-size: 14px;
            text-transform: uppercase;
        }

        .departure-table td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            vertical-align: middle;
        }

        .col-time { color: var(--szdc-yellow); font-weight: bold; width: 8%; }
        .col-kind { color: var(--szdc-white); font-weight: bold; width: 8%; }
        .col-number { color: var(--szdc-white); width: 8%; }
        .col-destination { color: var(--szdc-white); font-weight: bold; font-size: 20px; width: 35%; }
        .col-track { color: var(--szdc-yellow); text-align: center; font-weight: bold; font-size: 20px; width: 8%; }
        .col-delay { color: var(--szdc-orange); font-weight: bold; text-align: right; width: 15%; }

        .blink {
            animation: blinker 1.5s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0.2; }
        }

        .status-msg {
            padding: 30px;
            text-align: center;
            color: var(--szdc-gray);
            font-style: italic;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="board-container">
        <div class="board-header">
            <div class="station-name">Praha hlavní nádraží</div>
            <div class="current-time" id="live-clock">00:00:00</div>
        </div>

        <table class="departure-table">
            <thead>
                <tr>
                    <th>Čas</th>
                    <th>Druh</th>
                    <th>Číslo</th>
                    <th>Cílová stanice</th>
                    <th style="text-align: center;">Kolej</th>
                    <th style="text-align: right;">Poznámka</th>
                </tr>
            </thead>
            <tbody id="board-body">
                <tr>
                    <td colspan="6" class="status-msg">Načítám aktuální data ze sítě Správy železnic...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // Živé hodiny na tabuli
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('live-clock').textContent = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function fetchRealTrainData() {
            const tbody = document.getElementById('board-body');

            try {
                // Stažení z oficiálního otevřeného CDN zrcadla PID, které obsahuje živé odjezdy vlaků
                // Tento soubor nemá ŽÁDNÉ omezení CORS, GitHub ho stáhne napřímo bez klíčů a chyb!
                const response = await fetch('https://data.pid.cz/departures/?ids=U142Z301&limit=15&title=Praha+hl.n.&format=time' + Date.now());
                
                if (!response.ok) throw new Error("Chyba stahování souboru");
                
                const data = await response.json();
                tbody.innerHTML = "";

                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="status-msg">Momentálně nejsou dostupné žádné vlaky.</td></tr>`;
                    return;
                }

                // Vyfiltrujeme pouze odjezdy z Hlavního nádraží v Praze, které jsou v budoucnu
                const now = new Date();
                const pragueTrains = data.filter(item => {
                    return item.stopName === "Praha hl.n." && new Date(item.timeScheduled) >= now;
                });

                if (pragueTrains.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="status-msg">V nejbližší době neodjíždí žádné reálné vlaky.</td></tr>`;
                    return;
                }

                // Seřadíme vlaky vzestupně podle plánovaného času odjezdu
                pragueTrains.sort((a, b) => new Date(a.timeScheduled) - new Date(b.timeScheduled));

                // Vykreslíme 13 nejbližších spojů na tabuli
                pragueTrains.slice(0, 13).forEach(train => {
                    const schedTime = new Date(train.timeScheduled);
                    const timeString = `${String(schedTime.getHours()).padStart(2, '0')}:${String(schedTime.getMinutes()).padStart(2, '0')}`;
                    
                    const trainType = train.routeShortName || "Vlak";
                    const trainNum = train.tripNumber || "";
                    const destination = train.headsign || "Směr cíl";
                    const track = train.platform || "—";
                    const delayMinutes = train.delay || 0;
                    
                    let noteCell = "";
                    if (train.isCanceled) {
                        noteCell = `<span style="color:red; font-weight:bold;">VLAK ZRUŠEN</span>`;
                    } else if (delayMinutes > 0) {
                        noteCell = `<span class="blink">Zpoždění ${delayMinutes} min</span>`;
                    } else {
                        noteCell = `<span style="color:var(--szdc-gray); font-size:14px;">Pravidelný odjezd</span>`;
                    }

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="col-time">${timeString}</td>
                        <td class="col-kind">${trainType}</td>
                        <td class="col-number">${trainNum}</td>
                        <td class="col-destination">${destination}</td>
                        <td class="col-track">${track}</td>
                        <td class="col-delay">${noteCell}</td>
                    `;
                    tbody.appendChild(row);
                });

            } catch (error) {
                console.error("Detail:", error);
                tbody.innerHTML = `<tr><td colspan="6" class="status-msg" style="color:red;">Došlo k chybě při zpracování dat z otevřeného registru.</td></tr>`;
            }
        }

        window.onload = function() {
            fetchRealTrainData();
            setInterval(fetchRealTrainData, 30000); // Pravidelná obnova každých 30 sekund
        };
    </script>
</body>
</html>
