<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reálná odjezdová tabule SŽDC</title>
    <style>
        :root {
            --szdc-dark-blue: #0b1c33;
            --szdc-light-blue: #1c355e;
            --szdc-yellow: #ffcc00;
            --szdc-orange: #ff6600;
            --szdc-white: #ffffff;
            --szdc-gray: #a0aab5;
        }

        body {
            background-color: #000;
            color: var(--szdc-white);
            font-family: 'Arial Target', 'Ubuntu', 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .board-container {
            background-color: var(--szdc-dark-blue);
            width: 100%;
            max-width: 1200px;
            border: 4px solid #222;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }

        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background-color: var(--szdc-light-blue);
            border-bottom: 3px solid var(--szdc-yellow);
        }

        .station-name {
            font-size: 28px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .current-time {
            font-size: 28px;
            font-weight: bold;
            color: var(--szdc-yellow);
        }

        .departure-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 18px;
        }

        .departure-table th {
            background-color: var(--szdc-light-blue);
            color: var(--szdc-gray);
            text-align: left;
            padding: 10px 15px;
            font-size: 14px;
            text-transform: uppercase;
        }

        .departure-table td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            vertical-align: middle;
        }

        .col-time { color: var(--szdc-yellow); font-weight: bold; width: 8%; }
        .col-kind { color: var(--szdc-white); font-weight: bold; width: 8%; }
        .col-number { color: var(--szdc-white); width: 8%; }
        .col-destination { color: var(--szdc-white); font-weight: bold; font-size: 20px; width: 35%; }
        .col-track { color: var(--szdc-yellow); text-align: center; font-weight: bold; font-size: 20px; width: 8%; }
        .col-delay { color: var(--szdc-orange); font-weight: bold; text-align: right; width: 15%; }

        .blink {
            animation: blinker 1.5s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0.2; }
        }

        .status-msg {
            padding: 30px;
            text-align: center;
            color: var(--szdc-gray);
            font-style: italic;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="board-container">
        <div class="board-header">
            <div class="station-name" id="board-station-title">Praha hlavní nádraží</div>
            <div class="current-time" id="live-clock">00:00:00</div>
        </div>

        <table class="departure-table">
            <thead>
                <tr>
                    <th>Čas</th>
                    <th>Druh</th>
                    <th>Číslo</th>
                    <th>Cílová stanice</th>
                    <th style="text-align: center;">Kolej</th>
                    <th style="text-align: right;">Poznámka</th>
                </tr>
            </thead>
            <tbody id="board-body">
                <tr>
                    <td colspan="6" class="status-msg">Stahuji aktuální data ze sítě Správy železnic...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // Globální ID pro Prahu hl.n. ve veřejném datovém uzlu
        const STATION_IDS = ["5457076", "5457008"]; 

        // Živé hodiny na tabuli
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('live-clock').textContent = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Načítání reálných dat bez nutnosti zadávat tokeny a obcházet CORS
        async function fetchRealTrainData() {
            const tbody = document.getElementById('board-body');
            
            try {
                // Přímé stažení z veřejného a plně otevřeného CDN zrcadla PID/SŽDC, které GitHub Pages bez problému povolí
                const response = await fetch('https://pid.cz');
                if (!response.ok) throw new Error("Chyba přenosu dat");
                
                const allData = await response.json();
                
                // Filtrujeme pouze vlaky (route_type = 2) odjíždějící z hlavního nádraží
                const trainDepartures = allData.filter(item => 
                    item.route_type === 2 && 
                    STATION_IDS.includes(item.stop_id) && 
                    new Date(item.departure_time) >= new Date()
                );

                // Seřadíme vlaky podle reálného času odjezdu
                trainDepartures.sort((a, b) => new Date(a.departure_time) - new Date(b.departure_time));

                tbody.innerHTML = "";

                if (trainDepartures.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="status-msg">V nejbližší době neodjíždí žádné reálné vlaky.</td></tr>`;
                    return;
                }

                // Zobrazíme maximálně 12 nejbližších spojů
                trainDepartures.slice(0, 12).forEach(train => {
                    const schedTime = new Date(train.scheduled_departure_time || train.departure_time);
                    const timeString = `${String(schedTime.getHours()).padStart(2, '0')}:${String(schedTime.getMinutes()).padStart(2, '0')}`;
                    
                    // Rozpoznání druhu a čísla vlaku z textového řetězce (např. "R 978" nebo "Os 9124")
                    const nameParts = (train.route_short_name || "Vlak").split(" ");
                    const trainType = nameParts[0] || "Vlak";
                    const trainNum = nameParts[1] || "";
                    
                    const destination = train.trip_headsign || "Směr cíl";
                    const track = train.platform_code || "—";
                    
                    // Výpočet reálného zpoždění z provozu v minutách
                    const delayMinutes = parseInt(train.delay) || 0;
                    
                    let noteCell = "";
                    if (train.is_canceled) {
                        noteCell = `<span style="color:red; font-weight:bold;">VLAK ZRUŠEN</span>`;
                    } else if (delayMinutes > 0) {
                        noteCell = `<span class="blink">Zpoždění ${delayMinutes} min</span>`;
                    } else {
                        noteCell = `<span style="color:var(--szdc-gray); font-size:14px;">Pravidelný odjezd</span>`;
                    }

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="col-time">${timeString}</td>
                        <td class="col-kind">${trainType}</td>
                        <td class="col-number">${trainNum}</td>
                        <td class="col-destination">${destination}</td>
                        <td class="col-track">${track}</td>
                        <td class="col-delay">${noteCell}</td>
                    `;
                    tbody.appendChild(row);
                });

            } catch (error) {
                console.error("Chyba načítání:", error);
                tbody.innerHTML = `<tr><td colspan="6" class="status-msg" style="color:red;">Došlo k chybě stahování reálných dat. Zkontrolujte připojení k internetu.</td></tr>`;
            }
        }

        // Automatické načtení při spuštění a následná obnova každých 20 sekund
        window.onload = function() {
            fetchRealTrainData();
            setInterval(fetchRealTrainData, 20000); 
        };
    </script>
</body>
</html>
