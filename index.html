<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odjezdová tabule SŽDC</title>
    <style>
        :root {
            --szdc-dark-blue: #0b1c33;
            --szdc-light-blue: #1c355e;
            --szdc-yellow: #ffcc00;
            --szdc-orange: #ff6600;
            --szdc-white: #ffffff;
            --szdc-gray: #a0aab5;
        }

        body {
            background-color: #000;
            color: var(--szdc-white);
            font-family: 'Arial Target', 'Ubuntu', 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .board-container {
            background-color: var(--szdc-dark-blue);
            width: 100%;
            max-width: 1200px;
            border: 4px solid #222;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }

        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background-color: var(--szdc-light-blue);
            border-bottom: 3px solid var(--szdc-yellow);
        }

        .station-name {
            font-size: 28px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .current-time {
            font-size: 28px;
            font-weight: bold;
            color: var(--szdc-yellow);
        }

        .departure-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 18px;
        }

        .departure-table th {
            background-color: var(--szdc-light-blue);
            color: var(--szdc-gray);
            text-align: left;
            padding: 10px 15px;
            font-size: 14px;
            text-transform: uppercase;
        }

        .departure-table td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            vertical-align: middle;
        }

        .col-time { color: var(--szdc-yellow); font-weight: bold; width: 10%; }
        .col-kind { color: var(--szdc-white); font-weight: bold; width: 10%; }
        .col-number { color: var(--szdc-white); width: 10%; }
        .col-destination { color: var(--szdc-white); font-weight: bold; font-size: 20px; width: 40%; }
        .col-track { color: var(--szdc-yellow); text-align: center; font-weight: bold; font-size: 20px; width: 10%; }
        .col-delay { color: var(--szdc-orange); font-weight: bold; text-align: right; width: 20%; }

        .blink {
            animation: blinker 1.5s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0.2; }
        }
    </style>
</head>
<body>

    <div class="board-container">
        <div class="board-header">
            <div class="station-name">Praha hlavní nádraží</div>
            <div class="current-time" id="live-clock">00:00:00</div>
        </div>

        <table class="departure-table">
            <thead>
                <tr>
                    <th>Čas</th>
                    <th>Druh</th>
                    <th>Číslo</th>
                    <th>Cílová stanice</th>
                    <th style="text-align: center;">Kolej</th>
                    <th style="text-align: right;">Poznámka</th>
                </tr>
            </thead>
            <tbody id="board-body">
                <!-- Data se vygenerují okamžitě pomocí JavaScriptu -->
            </tbody>
        </table>
    </div>

    <script>
        // Živé hodiny na tabuli
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('live-clock').textContent = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Autonomní generátor reálného provozu na základě času v PC
        function generateLiveTraffic() {
            const tbody = document.getElementById('board-body');
            tbody.innerHTML = "";
            
            // Seznam reálných linek a destinací z Prahy hl.n.
            const routes = [
                { name: "Brno hl.n.", type: "rj", num: "259" },
                { name: "Hamburg-Altona", type: "EC", num: "176" },
                { name: "Milovice", type: "Os", num: "9124" },
                { name: "Benešov u Prahy", type: "Os", num: "2546" },
                { name: "Linz Hbf", type: "Ex", num: "335" },
                { name: "Mnichov Hbf", type: "Ex", num: "352" },
                { name: "Ostrava hl.n.", type: "IC", num: "515" },
                { name: "Bratislava hl.st.", type: "EC", num: "283" },
                { name: "Beroun", type: "Os", num: "8826" },
                { name: "Kolín", type: "Os", num: "9333" },
                { name: "Plzeň hl.n.", type: "R", num: "764" },
                { name: "Cheb", type: "R", num: "612" }
            ];

            const now = new Date();
            
            // Vygenerujeme 12 řádků vlaků s logickými rozestupy
            for (let i = 0; i < 12; i++) {
                // Každý další vlak odjíždí o cca 5 až 8 minut později
                const trainTime = new Date(now.getTime() + (i * 6 + 3) * 60000);
                const timeString = `${String(trainTime.getHours()).padStart(2, '0')}:${String(trainTime.getMinutes()).padStart(2, '0')}`;
                
                const route = routes[i % routes.length];
                
                // Generování sektorů kolejí podle standardu SŽDC (např. 3S, 5J, 1b)
                const trackNum = (Math.floor(Math.random() * 7) + 1);
                const trackSector = Math.random() > 0.5 ? "S" : "J";
                const track = i > 8 ? "—" : trackNum + trackSector; // Poslední vlaky ještě nemají určenou kolej
                
                // Určení stavu vlaku a zpoždění
                let noteCell = `<span style="color:var(--szdc-gray); font-size:14px;">Pravidelný odjezd</span>`;
                
                if (i === 1) {
                    noteCell = `<span class="blink">Zpoždění 10 min</span>`;
                } else if (i === 4) {
                    noteCell = `<span class="blink">Zpoždění 25 min</span>`;
                } else if (i === 0) {
                    noteCell = `<span style="color:var(--szdc-yellow);">Nastupujte</span>`;
                } else if (i === 2) {
                    noteCell = `<span style="color:var(--szdc-yellow);">Vlak přistaven</span>`;
                }

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="col-time">${timeString}</td>
                    <td class="col-kind">${route.type}</td>
                    <td class="col-number">${route.num}</td>
                    <td class="col-destination">${route.name}</td>
                    <td class="col-track">${track}</td>
                    <td class="col-delay">${noteCell}</td>
                `;
                tbody.appendChild(row);
            }
        }

        // Spuštění generátoru ihned po načtení a aktualizace každých 30 sekund
        window.onload = function() {
            generateLiveTraffic();
            setInterval(generateLiveTraffic, 30000); 
        };
    </script>
</body>
</html>
