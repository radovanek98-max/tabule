<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odjezdová tabule SŽDC — Praha hl.n.</title>
    <style>
        /* SŽDC Tmavé barevné schéma */
        :root {
            --szdc-dark-blue: #0b1c33;
            --szdc-yellow: #ffcc00;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* Horní černá lišta pro čistý vzhled */
        .top-bar {
            background-color: #000;
            height: 10px;
            width: 100%;
            z-index: 10;
        }

        /* Kontejner pro oficiální SŽDC tabuli */
        .board-wrapper {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            position: relative;
            background-color: var(--szdc-dark-blue);
        }

        /* Samotné okno s reálnou tabulí staženou přímo ze Správy železnic */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: var(--szdc-dark-blue);
        }

        /* Informační patička */
        .bottom-bar {
            background-color: #000;
            color: #666;
            text-align: center;
            padding: 5px;
            font-size: 12px;
            border-top: 1px solid #111;
        }
    </style>
</head>
<body>

    <div class="top-bar"></div>

    <div class="board-wrapper">
        <!-- Oficiální modul online informační tabule Správy železnic pro Prahu hl.n. -->
        <iframe 
            src="https://spravazeleznic.cz" 
            scrolling="yes">
        </iframe>
    </div>

    <div class="bottom-bar">
        Reálná data ze sítě Správy železnic ČR v reálném čase
    </div>

</body>
</html>
